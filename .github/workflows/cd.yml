name: Node.js CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar -czf /tmp/bincom-nodejs-app.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            -C "$GITHUB_WORKSPACE" .

      - name: Create systemd service file
        run: |
          cat > /tmp/bincom-nodejs-app.service <<'SERVICE'
          [Unit]
          Description=Bincom Node.js Express Application
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/bincom-nodejs-app
          Environment=NODE_ENV=production
          Environment=HOSTNAME=0.0.0.0
          Environment=PORT=3002
          ExecStart=/usr/bin/npm start
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

      - name: Copy application and service file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/bincom-nodejs-app.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/bincom-nodejs-app.tar.gz"

          scp -i ~/.ssh/deploy_key \
            /tmp/bincom-nodejs-app.service \
            "$EC2_USER@$EC2_HOST:/tmp/bincom-nodejs-app.service"

      - name: Deploy and restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR=/opt/bincom-nodejs-app

          sudo mkdir -p "$APP_DIR"
          sudo find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            -exec rm -rf -- {} +

          sudo tar -xzf /tmp/bincom-nodejs-app.tar.gz -C "$APP_DIR"
          sudo chown -R ubuntu:ubuntu "$APP_DIR"

          cd "$APP_DIR"
          npm ci --omit=dev

          sudo install -m 644 \
            /tmp/bincom-nodejs-app.service \
            /etc/systemd/system/bincom-nodejs-app.service

          sudo systemctl daemon-reload
          sudo systemctl enable bincom-nodejs-app
          sudo systemctl restart bincom-nodejs-app

          for attempt in $(seq 1 15); do
            if curl --fail --silent \
              http://127.0.0.1:3002/hello >/dev/null; then
              echo "Deployment successful: /hello is responding."
              exit 0
            fi
            sleep 2
          done

          sudo systemctl status bincom-nodejs-app --no-pager || true
          sudo journalctl -u bincom-nodejs-app -n 50 --no-pager || true
          echo "Health check failed."
          exit 1
          REMOTE

      - name: Verify public application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 3 \
            "http://$EC2_HOST:3002/hello"
          echo
